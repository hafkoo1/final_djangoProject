{% extends 'library/base.html' %}
{% block title %}Реєстрація{% endblock %}
{% block content %}
<h1>Реєстрація нового користувача</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-success">Зареєструватися</button>
</form>
<p style="margin-top: 15px;">Вже маєте акаунт? <a href="{% url 'accounts:login' %}">Увійти</a></p>
{% endblock %}
