{% extends 'library/base.html' %}
{% block title %}Заявка на бронювання{% endblock %}
{% block content %}
<h1>Бронювання книги: "{{ book.title }}"</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Надіслати заявку</button>
</form>
<p><a href="{% url 'library:book_detail' book.pk %}">Скасувати</a></p>
{% endblock %}
