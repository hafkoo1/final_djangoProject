{% extends 'library/base.html' %}
{% block title %}Видалити книгу{% endblock %}
{% block content %}
<h1>Ви справді хочете видалити книгу "{{ book.title }}"?</h1>
<form method="post" style="margin-top: 20px;">
    {% csrf_token %}
    <button type="submit" class="btn-danger">Так, видалити</button>
    <a href="{% url 'library:book_detail' book.pk %}" style="margin-left: 15px; text-decoration: none; color: #333;">Скасувати</a>
</form>
{% endblock %}
